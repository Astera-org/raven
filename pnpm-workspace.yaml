packages:
  - admin-ui
  - backend-ts
  - snapshot-tests
  - tests
  - admin-ui-e2e
  - eslint-config
  - eslint-rules
  - cli
  - importers/*
  - core/*
  - docs
  - docs/screenshots

allowBuilds:
  "@swc/core": true
  core-js: true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true

# Single source of truth for dependency versions across the monorepo.
# Reference these from package.json with `"<pkg>": "catalog:"`.
catalog:
  # --- Runtime: shared ---
  hast-util-from-html: ^2.0.3
  js-yaml: ^5.5.0
  # Pinned: the myst-* packages are upgraded together.
  myst-ext-button: 0.0.2
  myst-ext-card: 1.0.9
  myst-ext-exercise: 1.0.10
  myst-ext-grid: 1.1.1
  myst-ext-proof: 1.0.13
  myst-ext-tabs: 1.0.10
  myst-parser: 1.7.4
  mysql2: ^3.12.0
  smol-toml: ^1.3.4

  # --- Tooling (root devDeps, also referenced by packages if needed) ---
  "@eslint/js": ^9.39.5
  "@eslint/markdown": ^8.0.3
  "@playwright/test": ^1.63.0
  dotenv: ^18.0.3
  "@typescript-eslint/eslint-plugin": ^8.60.1
  "@typescript-eslint/parser": ^8.60.1
  "@typescript-eslint/utils": ^8.60.1
  "@types/js-yaml": ^4.0.9
  "@types/node": ^24.13.2
  "@types/supertest": ^7.2.0
  drizzle-kit: ^0.31.10
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-package-json: ^1.1.0
  eslint-plugin-simple-import-sort: ^14.0.0
  eslint-plugin-unused-imports: ^4.1.4
  globals: ^17.14.0
  hono: ^4.12.23
  jiti: ^2.6.1
  prettier: ^3.8.1
  prettier-plugin-organize-imports: ^4.3.0
  supertest: ^7.2.2
  tsx: ^4.19.2
  typescript: ^5.9.3
  typescript-eslint: ^8.60.1
  vitest: ^3.0.7
  zod: ^4.4.3
