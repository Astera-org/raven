pre-commit:
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is not installed; see the prerequisites in docs/raven/developers/get-started.md" >&2
          exit 1
        fi
        gitleaks git --staged --redact --verbose --no-banner

