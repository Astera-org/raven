server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /thestacks/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # nginx's mime.types has no .mjs entry, and browsers refuse to import modules served as
    # application/octet-stream. MyST serves anywidget modules (e.g. the footer) from _public/*.mjs.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location ~ ^/(raven|thestacks)/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
