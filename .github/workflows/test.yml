name: Run automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install typescript dependencies
        run: pnpm install

      - name: Run unit tests
        working-directory: ./backend-ts
        run: pnpm run test

      - name: Start test services
        run: docker compose -f tests/docker-compose.test.yml up -d --build --wait

      - name: Run typescript integration tests
        working-directory: ./tests
        run: pnpm exec vitest run integration

      - name: Stop test services
        if: always()
        run: docker compose -f tests/docker-compose.test.yml down -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install typescript dependencies
        run: pnpm install

      - name: Run backend tests
        working-directory: ./snapshot-tests
        run: pnpm run test
