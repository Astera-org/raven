name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On push and pull_request, scans only the new commits; on
      # workflow_dispatch, scans the full history.
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.7
          extra_args: --results=verified,unknown
